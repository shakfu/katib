[workspace]
resolver = "3"
members = [
    "crates/katib-core",
    "crates/katib-editor",
    "crates/katib-sync",
    "crates/katib-agent",
    "crates/katib-lsp",
    "crates/katib",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
katib-core = { path = "crates/katib-core" }
katib-editor = { path = "crates/katib-editor" }
katib-sync = { path = "crates/katib-sync" }
katib-agent = { path = "crates/katib-agent" }
katib-lsp = { path = "crates/katib-lsp" }
# Providers and the agent loop. To build against a minima checkout instead, add
# `[patch.crates-io] minima-core = { path = "../minima/crates/minima-core" }`.
minima-core = "0.7.1"
# Pinned to the minor: gpui-kit is pre-1.0 and pins an exact GPUI snapshot.
gpui-kit = "=0.11.0"
sha2 = "0.11"
rusqlite = { version = "0.43", features = ["bundled"] }
pulldown-cmark = { version = "0.13", default-features = false }
