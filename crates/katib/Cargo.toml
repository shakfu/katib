[package]
name = "katib"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
katib-core.workspace = true
katib-editor.workspace = true
katib-sync.workspace = true
katib-agent.workspace = true
# syntect: markdown highlighting in raw mode.
gpui-kit = { workspace = true, features = ["syntect"] }
notify = "8"
# The local date, for daily notes; gpui-kit already depends on it.
jiff = "1"
# The types of the raw editor's completion api; the versions gpui-kit uses.
lsp-types = "=0.97.0"
anyhow = "1"
