[package]
name = "katib-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

# No GPUI: the vault tools run under minima-core's agent loop, and later under the MCP server.
[dependencies]
katib-core.workspace = true
minima-core.workspace = true
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
# The agent thread's runtime; `time` and `net` for minima-core's retries and requests.
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
# Prompts to the agent thread and events back; blocking on one side, awaited on the other.
async-channel = "2"
# The machine config directory; the version gpui-kit already uses.
dirs = "6"

[dev-dependencies]
minima-core = { workspace = true, features = ["testing"] }
